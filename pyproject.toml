[project]
name = "odessy"
version = "0.2.0"
description = "Odessy v0.2.0 local command-line agent runtime."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
odessy-loop = "odessy.cli:main"
odessy = "odessy.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "anyio>=4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
