[project]
name = "odessy"
version = "0.5.0.dev0"
description = "Odessy agent runtime and role-aware desktop setup."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
  "jsonschema>=4",
  "fastapi>=0.115,<1",
  "httpx2>=2.13,<3",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
odessy-loop = "odessy.entrypoint:main"
odessy = "odessy.entrypoint:main"
odessy-executor = "odessy.application.executor:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "anyio>=4",
  "httpx>=0.27,<1",
]
cloud = [
  "anthropic>=1.15",
]
ui = [
  "zeroconf>=0.131,<1",
  "ifaddr>=0.2,<1",
  "keyring>=25.0,<26",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
# Wake-word activation. Optional: importing `odessy.voice` must not require it, so
# the detector and the VAD import openwakeword lazily and fail with a message that
# says how to install it. Model weights are NOT covered by this extra and are not
# Apache-licensed; `odessy voice --setup-wake` fetches them explicitly.
wake = [
  "openwakeword>=0.6.0",
  "numpy>=1.26",
]
# Accept-tap LAN pairing: announces `_odessy-exec._tcp.local.` so a coordinator
# on the same network can find this host. Also included in the desktop UI extra;
# headless execution hosts can install only this smaller extra.
pairing = [
  "zeroconf>=0.131,<1",
  "ifaddr>=0.2,<1",
]
# The existing voice pipeline's Python dependencies. Declared now because the wake
# session reuses them, and because a clone could not run `odessy voice` at all while
# they were undeclared.
voice = [
  "sounddevice>=0.5,<1",
  "kokoro-onnx>=0.4.0",
  "onnxruntime>=1.17",
  "numpy>=1.26",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"odessy.execution" = ["contract.json"]
# The pinned voice artifact manifest must travel with the code: the setup helper
# reads it by path at install time, and an installed application reads it when
# reporting voice readiness.
"odessy.setup" = ["voice-artifacts.json"]
# The Harness engine's production inputs. `harness-artifacts.json` is the one
# declaration of the tested runtime distribution and its digests (`pin.py` derives
# its enforced constants from it), and `bundle/` is the plugin closure the engine
# composes. Both must be in the wheel or an installed application would resolve a
# different set from the checkout that was tested.
"odessy.runtime_backends.harness" = [
  "harness-artifacts.json",
  "bundle/odessy-stream-bridge/package.json",
  "bundle/odessy-stream-bridge/cordis.patch.yml",
  "bundle/odessy-stream-bridge/lib/index.js",
]
