[package]
name = "odessy-link"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Authenticated host pairing and MCP transport for Odessy."
license = "Apache-2.0"

[features]
# Off by default and never enabled for a release artifact. It adds an explicitly
# unapproved pairing exchange so software around the M0 gate can be exercised end to
# end. A build without it contains no way to enroll by short code at all.
default = []
test-profile = []

[[bin]]
name = "odessy-link"
path = "src/main.rs"

[[bin]]
# The packaged Windows executor's small native window. No Flutter, no model.
name = "odessy-executor"
path = "src/bin/executor.rs"

[dependencies]
# OS metrics only; version supports the existing Rust 1.85 floor.
sysinfo = { version = "=0.33.1", default-features = false, features = ["system", "disk", "network", "component"] }
# Certificate generation. ECDSA P-256 per the pairing plan; ring is the installed
# crypto provider, so no C toolchain beyond rusqlite's bundled build is needed.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
# Per-user trust registry.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
# TLS. `ring` (not aws-lc-rs) keeps the build to a C compiler we already need for
# rusqlite's bundled SQLite.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "time", "sync"] }
# Address discovery only. Advertisements never enroll, grant, or replace the saved
# certificate identity; the manual address remains the fallback.
mdns-sd = "0.13"
# ECDSA P-256 possession proofs for enrollment. Already present transitively through
# rustls/rcgen's `ring` provider, so this adds no new C build and no second provider.
ring = "0.17"

[target.'cfg(unix)'.dependencies]
# Signalling the process group created at spawn, so descendants are terminated too.
libc = "0.2"

[profile.release]
strip = "symbols"
