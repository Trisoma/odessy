# The Odessy bridge row, plus the runtime's own clarification tool.
#
# This file is a production input: it ships inside the `odessy` package as
# `odessy/runtime_backends/harness/bundle/odessy-stream-bridge/` and is declared in
# `harness-artifacts.json` (plugin closure) with a digest per file. The developer
# installer (`experiments/restructure/harness_compatibility/install_plugin.py`) resolves
# this directory through `odessy.runtime_backends.harness.resources`; there is no second
# copy of the bundle in the experiment tree.
#
# Port and token come from the child environment so the same bundle can be installed once
# and pointed at different runs. The plugin refuses to load without them (fail fast).
#
# It also mounts the runtime's own model-facing clarification tool. That tool only asks a
# human and returns the answer as an ordinary tool result; it has no filesystem, process or
# network effect. Every other model-facing tool row stays disabled by Odessy's narrow
# overlay, which is applied after this layer.
- insert:
    - id: odessy-stream-bridge
      name: '@odessy/dsh-stream-bridge'
      config:
        host: '127.0.0.1'
        port: !!js Number(process.env.ODESSY_BRIDGE_PORT)
        token: !!js process.env.ODESSY_BRIDGE_TOKEN
        questionTimeoutMs: !!js Number(process.env.ODESSY_QUESTION_TIMEOUT_MS || 300000)
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
