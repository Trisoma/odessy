name: Native setup acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/odessy/setup/**'
      - 'tool/*setup*'
      - 'tests/test_setup*'
      - 'pyproject.toml'
      - '.github/workflows/setup-native.yml'
permissions:
  contents: read
concurrency:
  group: setup-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install setuptools wheel pytest
      - run: python -m pip wheel . --no-build-isolation --no-deps --wheel-dir wheelhouse
      - name: Resolve native dependency wheels at build time
        shell: bash
        run: python -m pip download --only-binary=:all: --dest wheelhouse wheelhouse/odessy-*.whl
      - run: python -m pytest tests/test_setup_services.py tests/test_setup_maintenance.py tests/test_setup_bundle.py -q
      - run: python tool/check_setup_installation.py --wheelhouse wheelhouse
      - name: Build offline Python-required bootstrap archive
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from pathlib import Path
          manifest=json.loads(Path('wheelhouse/manifest.json').read_text())
          Path('licenses.json').write_text(json.dumps({a['file']:a['license'] for a in manifest['artifacts']}))
          subprocess.run([sys.executable,'tool/build_setup_bundle.py','--wheelhouse','wheelhouse','--licenses','licenses.json','--output','odessy-setup-${{ runner.os }}-${{ runner.arch }}.zip'],check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ runner.os }}-${{ runner.arch }}
          path: odessy-setup-*.zip
