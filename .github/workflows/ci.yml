name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.10 is the declared minimum and the Jetson runtime.
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          # The laptop side runs on Windows.
          # The installer pins its private application environment to CPython 3.12.
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    env:
      # Never read the committed developer config (laptop MCP URL, model paths).
      ODESSY_CONFIG_FILE: ${{ github.workspace }}/.ci-no-config.env
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      # The runner context is unavailable in job-level env. Export the cache from
      # a step. Put built-in modules first so cmdlet discovery avoids runner extras.
      - name: Prepare Windows PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 1
        run: |
          $env:PSModulePath = (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules') + ';' + (Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules')
          "PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PSModuleAnalysisCachePath = Join-Path $env:RUNNER_TEMP 'ps-module-analysis-cache'
          "PSModuleAnalysisCachePath=$env:PSModuleAnalysisCachePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Exercise the module loading used by pwd, ls, and echo.
          powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; Get-Location; Get-ChildItem; Write-Output ready; exit 0'
          if ($LASTEXITCODE -ne 0) { throw "PowerShell preparation failed: $LASTEXITCODE" }

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Node is needed so the Python <-> Node MCP integration test runs instead of skipping.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Build Node tool server
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Odessy
        run: python -m pip install -e ".[test,ui]" "pytest-xdist>=3.6,<4"

      - name: Run tests
        # Two workers overlap subprocess/network waits without multiplying jobs.
        # Keep each file together for module-scoped fixtures and ordered tests.
        run: python -m pytest -q -n 2 --dist loadfile --tb=short --durations=10

      - name: CLI smoke test
        shell: bash
        run: |
          python -m odessy --help
          output="$(python -m odessy --fake-model "what time is it?")"
          echo "$output"
          [[ "$output" == "The current time is "* ]]
          # Single-machine mode: filesystem.list exists only on the Node tool server,
          # so this passes only if the CLI started it on loopback by itself.
          output="$(python -m odessy --fake-model "list .")"
          echo "$output"
          [[ "$output" == "Directory entries: "*"pyproject.toml"* ]]

  sandbox-live:
    # The unit tests check the bwrap argv; this job checks that the boundary holds on a
    # real kernel: no write outside the workspace, the network cut when denied, hidden
    # paths unreadable, limits applied. ODESSY_SANDBOX_LIVE=1 makes an unusable bwrap a
    # failure instead of a skip. Run the same two commands on the Jetson before a release.
    name: Sandbox, live bwrap (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ODESSY_CONFIG_FILE: ${{ github.workspace }}/.ci-no-config.env
      PYTHONUTF8: "1"
      ODESSY_SANDBOX_LIVE: "1"
    steps:
      - uses: actions/checkout@v5

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which
      # bwrap needs; a Jetson running an older Ubuntu has them on already.
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --unshare-pid --unshare-net --proc /proc true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Build Node tool server
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Odessy
        run: python -m pip install -e ".[test]"

      - name: Live sandbox (Python executor)
        run: python -m pytest -q tests/test_sandbox_live.py

      - name: Live sandbox (Node executor)
        working-directory: tools
        run: node --test dist/tests/sandbox-live.test.js

      - name: Doctor reports the sandbox
        run: |
          python -m odessy doctor | tee doctor.txt
          grep -q "read-only: bwrap (full; network cut, credentials hidden)" doctor.txt

  rust:
    name: odessy-link (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: native/odessy-link
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/odessy-link
      # Identity, enrolment, mutual TLS, framing, relay accounting and the journal.
      # No test here touches a real microphone or a second physical machine.
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  pairing:
    name: Paired transport (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      ODESSY_CONFIG_FILE: ${{ github.workspace }}/.ci-no-config.env
      PYTHONUTF8: "1"
      # Opts the two-process tests in: real `odessy-link serve` against a real
      # `odessy-link connect`, plus the Python adapter reaching the Node tool server.
      ODESSY_LINK_E2E: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/odessy-link

      - name: Build odessy-link
        working-directory: native/odessy-link
        run: cargo build --locked

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Build Node tool server
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Odessy
        run: python -m pip install -e ".[test]"

      # Relay accounting, duplicate ids, workspace grants, live revocation, process
      # tree cleanup, the agent's approval path, and Python → Rust → Node.
      - name: Paired transport and agent tests
        run: >-
          python -m pytest -q
          tests/test_paired_transport.py
          tests/test_paired_integration.py
          tests/test_paired_agent.py
          tests/test_paired_host.py

  tool-server:
    name: Tool server, Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Windows PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 1
        run: |
          $env:PSModulePath = (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules') + ';' + (Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules')
          "PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PSModuleAnalysisCachePath = Join-Path $env:RUNNER_TEMP 'ps-module-analysis-cache'
          "PSModuleAnalysisCachePath=$env:PSModuleAnalysisCachePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Exercise the module loading used by pwd, ls, and echo.
          powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; Get-Location; Get-ChildItem; Write-Output ready; exit 0'
          if ($LASTEXITCODE -ne 0) { throw "PowerShell preparation failed: $LASTEXITCODE" }

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/package-lock.json

      # Give the Linux runner a real confinement backend, so the host test asserts
      # confinement instead of finding none. Ubuntu 24.04 blocks the unprivileged
      # user namespaces bwrap needs unless AppArmor's restriction is lifted.
      - name: Enable bubblewrap
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Records which confinement backends this runner offers and why, so a host
      # test failure can be read without rerunning anything.
      - name: Report host confinement facts
        run: |
          npm run build --silent
          node --input-type=module -e "import { discoverHostFacts, renderHostFacts } from './dist/src/execution/probe.js'; console.log(renderHostFacts(discoverHostFacts()));"

      - name: Run tests
        run: npm test
