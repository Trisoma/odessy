name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.10 is the declared minimum and the Jetson runtime.
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          # The laptop side runs on Windows.
          - os: windows-latest
            python: "3.13"
    env:
      # Never read the committed developer config (laptop MCP URL, model paths).
      ODESSY_CONFIG_FILE: ${{ github.workspace }}/.ci-no-config.env
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Node is needed so the Python <-> Node MCP integration test runs instead of skipping.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Build Node tool server
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Odessy
        run: python -m pip install -e ".[test]"

      # TEMPORARY: measure why PowerShell commands time out on Windows runners.
      - name: Diagnose PowerShell startup
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: python
        run: |
          import os, subprocess, sys, time
          sys.path.insert(0, "src")
          from odessy.command_bridge import build_sanitized_environment
          base = build_sanitized_environment(os.environ)
          extra = lambda *names: {**base, **{n: os.environ[n] for n in names if n in os.environ}}
          variants = {
              "sanitized": base,
              "+LOCALAPPDATA": extra("LOCALAPPDATA"),
              "+USERPROFILE,APPDATA,LOCALAPPDATA": extra("USERPROFILE", "APPDATA", "LOCALAPPDATA"),
              "+PSModulePath": extra("PSModulePath"),
              "full": dict(os.environ),
          }
          print("PSModulePath =", os.environ.get("PSModulePath"))
          for label, env in variants.items():
              for attempt in (1, 2):
                  start = time.monotonic()
                  try:
                      r = subprocess.run(
                          ["powershell", "-NoProfile", "-NonInteractive", "-Command", "echo hi"],
                          env=env, capture_output=True, text=True, timeout=90,
                      )
                      outcome = f"exit={r.returncode} out={r.stdout.strip()!r} err={r.stderr.strip()[:200]!r}"
                  except subprocess.TimeoutExpired:
                      outcome = "TIMEOUT"
                  print(f"{label:40s} try{attempt} {time.monotonic() - start:6.2f}s {outcome}")

      - name: Run tests
        run: python -m pytest -q

      - name: CLI smoke test
        shell: bash
        run: |
          python -m odessy --help
          output="$(python -m odessy --fake-model "what time is it?")"
          echo "$output"
          [[ "$output" == "The current time is "* ]]

  tool-server:
    name: Tool server, Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/package-lock.json

      # Give the Linux runner a real confinement backend, so the host test asserts
      # confinement instead of finding none. Ubuntu 24.04 blocks the unprivileged
      # user namespaces bwrap needs unless AppArmor's restriction is lifted.
      - name: Enable bubblewrap
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
