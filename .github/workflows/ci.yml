name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.10 is the declared minimum and the Jetson runtime.
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          # The laptop side runs on Windows.
          - os: windows-latest
            python: "3.13"
    env:
      # Never read the committed developer config (laptop MCP URL, model paths).
      ODESSY_CONFIG_FILE: ${{ github.workspace }}/.ci-no-config.env
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Node is needed so the Python <-> Node MCP integration test runs instead of skipping.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Build Node tool server
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Odessy
        run: python -m pip install -e ".[test]"

      # TEMPORARY: find which environment variable PowerShell needs to start quickly
      # on Windows runners (sanitized env: ~25 s, full env: <3 s).
      - name: Diagnose PowerShell startup
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: python
        run: |
          import os, subprocess, sys, time
          sys.path.insert(0, "src")
          from odessy.command_bridge import build_sanitized_environment
          from odessy.redaction import looks_like_secret_name
          base = build_sanitized_environment(os.environ)
          candidates = sorted(
              k for k in os.environ if k not in base and not looks_like_secret_name(k)
          )
          print("candidates:", candidates)

          def seconds(names):
              env = {**base, **{n: os.environ[n] for n in names}}
              start = time.monotonic()
              try:
                  subprocess.run(
                      ["powershell", "-NoProfile", "-NonInteractive", "-Command", "echo hi"],
                      env=env, capture_output=True, timeout=60,
                  )
              except subprocess.TimeoutExpired:
                  return 60.0
              return time.monotonic() - start

          def fast(names):
              elapsed = seconds(names)
              print(f"  {len(names):3d} vars  {elapsed:6.2f}s  {names if len(names) <= 8 else ''}", flush=True)
              return elapsed < 8

          if not fast(candidates):
              print("even all candidates together are slow; the cause is not a missing variable")
              sys.exit(0)
          current = candidates
          while len(current) > 1:
              half = len(current) // 2
              left, right = current[:half], current[half:]
              if fast(left):
                  current = left
              elif fast(right):
                  current = right
              else:
                  print("needs variables from both halves:", left, right)
                  break
          print("NARROWED TO:", current)
          for name in current:
              print(f"  {name} = {os.environ[name]}")

      - name: Run tests
        run: python -m pytest -q

      - name: CLI smoke test
        shell: bash
        run: |
          python -m odessy --help
          output="$(python -m odessy --fake-model "what time is it?")"
          echo "$output"
          [[ "$output" == "The current time is "* ]]

  tool-server:
    name: Tool server, Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/package-lock.json

      # Give the Linux runner a real confinement backend, so the host test asserts
      # confinement instead of finding none. Ubuntu 24.04 blocks the unprivileged
      # user namespaces bwrap needs unless AppArmor's restriction is lifted.
      - name: Enable bubblewrap
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Records which confinement backends this runner offers and why, so a host
      # test failure can be read without rerunning anything.
      - name: Report host confinement facts
        run: |
          npm run build --silent
          node --input-type=module -e "import { discoverHostFacts, renderHostFacts } from './dist/src/execution/probe.js'; console.log(renderHostFacts(discoverHostFacts()));"

      - name: Run tests
        run: npm test
