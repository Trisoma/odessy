name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.10 is the declared minimum and the Jetson runtime.
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          # The laptop side runs on Windows.
          - os: windows-latest
            python: "3.13"
    env:
      # Never read the committed developer config (laptop MCP URL, model paths).
      ODESSY_CONFIG_FILE: ${{ github.workspace }}/.ci-no-config.env
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Node is needed so the Python <-> Node MCP integration test runs instead of skipping.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Build Node tool server
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Odessy
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: CLI smoke test
        shell: bash
        run: |
          python -m odessy --help
          output="$(python -m odessy --fake-model "what time is it?")"
          echo "$output"
          [[ "$output" == "The current time is "* ]]

  tool-server:
    name: Tool server, Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
