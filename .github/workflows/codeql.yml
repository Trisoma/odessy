name: CodeQL

# Scans only the languages this project actually writes.
#
# Deliberately excluded:
#   swift, c-cpp  -- the only Swift/Objective-C and C/C++ in this repository is the
#                    Flutter runner scaffolding under apps/desktop/{macos,windows,linux}.
#                    It is generated by `flutter create` and cannot be built without
#                    running Flutter tooling first (apps/desktop/macos/Flutter/ephemeral
#                    is generated and gitignored), so CodeQL autobuild fails on it.
#                    macOS is also an unsupported platform for this preview.
#   rust          -- CodeQL Rust support is experimental; native/odessy-link is small
#                    and the signal does not justify the noise.
#
# Interpreted languages need no build step. Go does, hence the autobuild below.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    # Weekly, so advisories published later still get picked up.
    - cron: "27 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions, go]
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # Only the compiled language needs a build; the rest are interpreted.
      - if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
